[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
rust-version = "1.97"

[workspace.dependencies]
anyhow = "1"
ash = "0.38"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
iced-x86 = { version = "1.22", default-features = false, features = ["std", "decoder", "intel", "instr_info"] }
memchr = "2"
memmap2 = "0.9"
naga = { version = "30", features = ["wgsl-in", "spv-out"] }
rayon = "1"
rspirv = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Memory", "Win32_System_Diagnostics_Debug", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_Kernel", "Win32_Security"] }
game-package = { path = "crates/game-package" }
shader-container = { path = "crates/shader-container" }
leonida-ui = { path = "crates/leonida-ui" }
pe-image = { path = "crates/pe-image" }
pe-loader = { path = "crates/pe-loader" }
shims = { path = "crates/shims" }
xbox-d3d12 = { path = "crates/xbox-d3d12" }
enhancements = { path = "crates/enhancements" }
upscale = { path = "crates/upscale" }
config = { path = "crates/config" }
decompile = { path = "crates/decompile" }
offline = { path = "crates/offline" }
gpu = { path = "crates/gpu" }
gpu-passes = { path = "crates/gpu-passes" }
rdna = { path = "crates/rdna" }
shader-ir = { path = "crates/shader-ir" }
shader-translate = { path = "crates/shader-translate" }
testkit = { path = "crates/testkit" }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
